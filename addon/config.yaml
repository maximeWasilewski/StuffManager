name: StuffManager
version: "1.5.1"
slug: stuffmanager
description: Inventaire des objets de la maison avec QR codes pour les lieux de rangement.
url: https://github.com/maximeWasilewski/StuffManager
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: false
webui: http://[HOST]:[PORT:8080]/
ports:
  "8080/tcp": 8080
ports_description:
  "8080/tcp": Interface web (téléphone et QR), sans ingress
environment:
  STUFFMANAGER_DATA: /data
backup: cold
options:
  openai_api_key: ""
  openai_model: "gpt-4.1-mini"
schema:
  openai_api_key: password?
  openai_model: str?
