# StuffManager — inventaire d'atelier.
# Les données (SQLite et photos) restent dans ./data sur l'hôte.

services:
  stuffmanager:
    build: .
    ports:
      - "8080:8080"
    environment:
      STUFFMANAGER_DATA: /app/data
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
